name: Terraform CI

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Run terraform apply after plan'
        required: false
        default: 'false'
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]



jobs:
  validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: terraform-azure-demo
      - name: Terraform init
        run: terraform init -backend=false
        working-directory: terraform-azure-demo
      - name: Terraform validate
        run: terraform validate
        working-directory: terraform-azure-demo

  plan:
    name: Terraform Plan (optional)
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Check Azure OIDC credentials
        id: check_oidc
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "Using OIDC authentication" >&2
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "Missing OIDC credentials (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID)" >&2
          fi

      - name: Azure Login (OIDC)
        if: ${{ steps.check_oidc.outputs.has_creds == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange
          environment: azurecloud
          allow-no-subscriptions: false
          enable-AzPSSession: false
      - name: Terraform Init
        if: ${{ steps.check_oidc.outputs.has_creds == 'true' }}
        run: terraform init
        working-directory: terraform-azure-demo
      - name: Terraform Plan
        if: ${{ steps.check_oidc.outputs.has_creds == 'true' }}
        run: terraform plan -out=tfplan
        working-directory: terraform-azure-demo
      - name: Upload tfplan
        if: ${{ steps.check_oidc.outputs.has_creds == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: tfplan
          path: terraform-azure-demo/tfplan

  apply:
    name: Terraform Apply (optional)
    runs-on: ubuntu-latest
    environment: production
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Check Azure OIDC credentials
        id: check_oidc
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "Using OIDC authentication" >&2
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "Missing OIDC credentials (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID)" >&2
          fi

      - name: Azure Login (OIDC)
        if: ${{ steps.check_oidc.outputs.has_creds == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange
          environment: azurecloud
          allow-no-subscriptions: false
          enable-AzPSSession: false
      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: terraform-azure-demo/.terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('terraform-azure-demo/.terraform.lock.hcl') }}

      - name: Download tfplan
        if: ${{ steps.check_oidc.outputs.has_creds == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform-azure-demo
          
      - name: Terraform Init
        if: ${{ steps.check_oidc.outputs.has_creds == 'true' }}
        run: terraform init
        working-directory: terraform-azure-demo
      - name: Terraform Apply
        if: ${{ steps.check_oidc.outputs.has_creds == 'true' }}
        run: terraform apply tfplan
        working-directory: terraform-azure-demo