name: Terraform CI

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Run terraform apply after plan'
        required: false
        default: 'false'
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]



jobs:
  validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: terraform-azure-demo
      - name: Terraform init
        run: terraform init -backend=false
        working-directory: terraform-azure-demo
      - name: Terraform validate
        run: terraform validate
        working-directory: terraform-azure-demo

  plan:
    name: Terraform Plan (optional)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Check Azure credentials
        id: creds
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -n "$AZURE_CREDENTIALS" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
          fi

      - name: Azure Login
        if: ${{ steps.creds.outputs.has_creds == 'true' }}
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Terraform Init
        if: ${{ steps.creds.outputs.has_creds == 'true' }}
        run: terraform init
        working-directory: terraform-azure-demo
      - name: Terraform Plan
        if: ${{ steps.creds.outputs.has_creds == 'true' }}
        run: terraform plan -out=tfplan
        working-directory: terraform-azure-demo
      - name: Upload tfplan
        if: ${{ steps.creds.outputs.has_creds == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: tfplan
          path: terraform-azure-demo/tfplan

  apply:
    name: Terraform Apply (optional)
    runs-on: ubuntu-latest
    environment: production
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true' }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Check Azure credentials
        id: creds
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -n "$AZURE_CREDENTIALS" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
          fi

      - name: Azure Login
        if: ${{ steps.creds.outputs.has_creds == 'true' }}
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: terraform-azure-demo/.terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('terraform-azure-demo/.terraform.lock.hcl') }}

      - name: Download tfplan
        if: ${{ steps.creds.outputs.has_creds == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform-azure-demo
          
      - name: Terraform Init
        if: ${{ steps.creds.outputs.has_creds == 'true' }}
        run: terraform init
        working-directory: terraform-azure-demo
      - name: Terraform Apply
        if: ${{ steps.creds.outputs.has_creds == 'true' }}
        run: terraform apply tfplan
        working-directory: terraform-azure-demo